name: dataset-annotation
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.12
  # Core scientific computing with compatible versions
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.0
  # PyTorch ecosystem
  - pytorch::pytorch=2.3.0
  - pytorch::torchvision=0.18.0
  - pytorch::torchaudio=2.3.0
  # Image processing
  - pillow=10.3.0
  - opencv=4.9.0
  # Development tools
  - pip
  - pytest=8.2.0
  - pip:
    # Install all pip dependencies from requirements.txt
    - -r requirements.txt
