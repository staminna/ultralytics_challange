name: ultralytics-annotation
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12

  # Core Web Framework
  - fastapi
  - uvicorn

  # Database & ODM
  - motor
  - beanie

  # Data Validation
  - pydantic
  - pydantic-settings
  - email-validator

  # Authentication
  - python-jose[cryptography]
  - passlib[bcrypt]

  # Google Cloud Services
  - google-cloud-storage

  # YOLO & Computer Vision
  - ultralytics
  - opencv
  - pytorch
  - torchvision
  - torchaudio
  - cpuonly # Add this line if you are on a CPU-only machine

  # Utilities
  - requests
  - tqdm
  - pyyaml
  - aiofiles
  - python-multipart
  - python-dotenv

  # Development & Testing
  - pytest
  - pytest-asyncio
  - black
  - isort
  - flake8
  - mypy
